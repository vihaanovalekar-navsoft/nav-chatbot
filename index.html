<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NavBot</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf7f0;
      --field: #fffdf9;
      --ink: #221d17;
      --muted: #786f61;
      --line: rgba(34, 29, 23, 0.14);
      --line-soft: rgba(34, 29, 23, 0.08);
      --fill: #f0e8d8;
      --accent: #a5622c;
      --accent-strong: #8b5122;
      --on-accent: #fffdf8;
      --column: 768px;
      --gutter: 24px;
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: var(--font);
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    body { overflow: hidden; }

    ::selection { background: rgba(165, 98, 44, 0.18); }

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .wrap {
      width: min(var(--column), 100%);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }

    /* Header */

    .topbar { flex: none; border-bottom: 1px solid var(--line-soft); }

    .topbar-inner {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mark {
      flex: none;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--on-accent);
      background: var(--accent);
    }

    .brand-name {
      font-size: 14.5px;
      font-weight: 650;
      letter-spacing: -0.005em;
      white-space: nowrap;
    }

    .ghost {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 9px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }

    .ghost:hover:not(:disabled) { color: var(--ink); background: var(--fill); }
    .ghost:disabled { opacity: 0.45; cursor: default; }
    .ghost svg { width: 12px; height: 12px; }

    /* Conversation */

    .scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(34, 29, 23, 0.24) transparent;
    }

    .thread {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      gap: 26px;
      padding-block: 40px 28px;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }

    ::-webkit-scrollbar-thumb {
      background: rgba(34, 29, 23, 0.22);
      border: 2px solid transparent;
      border-radius: 999px;
      background-clip: content-box;
    }

    .empty {
      margin: auto;
      max-width: 640px;
      text-align: center;
    }

    .empty h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .empty p {
      max-width: 54ch;
      margin: 10px auto 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      text-wrap: balance;
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 620px;
      margin: 24px auto 0;
    }

    .example {
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .example:hover { background: var(--fill); border-color: transparent; }

    /* Messages */

    .message { display: flex; }
    .message.user { justify-content: flex-end; }

    .body {
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-wrap: pretty;
    }

    .citation { color: var(--accent); font-weight: 600; }

    .message.user .body {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      background: var(--fill);
    }

    .sources {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line-soft);
      white-space: normal;
    }

    .sources-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sources-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
    }

    .sources-list li {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--muted);
    }

    .cite {
      flex: none;
      display: inline-grid;
      place-items: center;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      background: var(--fill);
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 10px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    /* Composer */

    .dock { flex: none; padding-block: 8px 20px; }

    .field {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--field);
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    .field:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(165, 98, 44, 0.13);
    }

    textarea {
      flex: 1;
      min-width: 0;
      max-height: 160px;
      padding: 9px 8px 9px 10px;
      border: 0;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    textarea::placeholder { color: var(--muted); }

    .send {
      flex: none;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--on-accent);
      background: var(--accent);
      cursor: pointer;
      transition: background 120ms ease, opacity 120ms ease;
    }

    .send:hover:not(:disabled) { background: var(--accent-strong); }
    .send:disabled { opacity: 0.3; cursor: default; }
    .send.sending { opacity: 1; }

    .send svg { width: 17px; height: 17px; }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 253, 248, 0.45);
      border-top-color: var(--on-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .send.sending svg { display: none; }
    .send.sending .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    :is(.ghost, .example, .send):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll { scroll-behavior: auto; }
      .typing span, .spinner { animation-duration: 2s; }
      .ghost, .example, .send, .field { transition: none; }
    }

    /* Mobile */

    @media (max-width: 640px) {
      :root { --gutter: 16px; }

      .topbar-inner { height: 56px; }
      .thread { padding-block: 28px 20px; gap: 22px; }
      .empty h2 { font-size: 22px; }
      .empty p { font-size: 13.5px; }
      .examples { margin-top: 20px; }
      .message.user .body { max-width: 88%; }
      textarea { font-size: 16px; }
      .dock { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      .field { border-radius: 16px; }
      .send { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="wrap topbar-inner">
        <div class="brand">
          <span class="mark" aria-hidden="true">N</span>
          <span class="brand-name">NavBot</span>
        </div>
        <button id="new-chat" class="ghost" type="button">
          <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          New chat
        </button>
      </div>
    </header>

    <main class="scroll" id="messages">
      <div class="thread wrap" id="thread" aria-live="polite">
        <section class="empty" id="empty">
          <h2>Ask NavBot</h2>
          <p>Products, integrations, industries, security, and company details.</p>
          <div class="examples">
            <button class="example" type="button" data-prompt="What does NavAI do?">What does NavAI do?</button>
            <button class="example" type="button" data-prompt="Which industries does NavAI serve?">Which industries does NavAI serve?</button>
            <button class="example" type="button" data-prompt="How does NavAI handle security?">How does NavAI handle security?</button>
          </div>
        </section>
      </div>
    </main>

    <footer class="dock">
      <div class="wrap">
        <form id="chat-form" class="field">
          <textarea id="message" name="message" rows="1" maxlength="2000" placeholder="Ask NavBot..." enterkeyhint="send" required></textarea>
          <button class="send" id="send" type="submit" aria-label="Send message" disabled>
            <svg viewBox="0 0 17 17" fill="none" aria-hidden="true">
              <path d="M8.5 13.5v-10M8.5 3.5l-4 4M8.5 3.5l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>
      </div>
    </footer>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const thread = document.getElementById("thread");
    const empty = document.getElementById("empty");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const newChat = document.getElementById("new-chat");
    const MAX_HISTORY_MESSAGES = 12;
    const MAX_HISTORY_CHARS = 12000;
    let history = [];
    let pending = false;

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderAnswer(text) {
      return escapeHtml(text).replace(
        /\[(\d+(?:\s*,\s*\d+)*)\]/g,
        '<span class="citation">[$1]</span>'
      );
    }

    function nearBottom() {
      return messages.scrollHeight - messages.scrollTop - messages.clientHeight < 80;
    }

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function addMessage(role, text, sources = []) {
      const stick = nearBottom();
      empty.hidden = true;

      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}`;
      const body = document.createElement("div");
      body.className = "body";
      if (role === "assistant") {
        body.innerHTML = renderAnswer(text);
      } else {
        body.textContent = text;
      }

      if (sources.length) {
        const seen = new Set();
        const rows = sources
          .filter((source) => {
            const label = String(source.label);
            if (seen.has(label)) return false;
            seen.add(label);
            return true;
          })
          .map((source) => {
            const cite = `<span class="cite">${escapeHtml(String(source.label))}</span>`;
            return `<li>${cite}<span>${escapeHtml(source.doc)}</span></li>`;
          });
        body.insertAdjacentHTML(
          "beforeend",
          `<div class="sources"><div class="sources-title">Sources</div><ul class="sources-list">${rows.join("")}</ul></div>`
        );
      }

      wrapper.append(body);
      thread.append(wrapper);
      if (stick || role === "user") scrollToBottom();
    }

    function showTyping() {
      const stick = nearBottom();
      const wrapper = document.createElement("div");
      wrapper.className = "message assistant";
      wrapper.id = "typing";
      const body = document.createElement("div");
      body.className = "body";
      body.setAttribute("aria-label", "Assistant is typing");
      body.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      wrapper.append(body);
      thread.append(wrapper);
      if (stick) scrollToBottom();
    }

    function hideTyping() {
      document.getElementById("typing")?.remove();
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }

    function syncSend() {
      sendButton.disabled = pending || input.value.trim() === "";
    }

    function setSending(state) {
      pending = state;
      sendButton.classList.toggle("sending", state);
      newChat.disabled = state;
      messages.setAttribute("aria-busy", String(state));
      syncSend();
    }

    // The API rejects more than 12 history messages or 12000 history characters.
    function payloadHistory() {
      const recent = history.slice(0, -1).slice(-MAX_HISTORY_MESSAGES);
      let chars = recent.reduce((total, message) => total + message.content.length, 0);
      while (recent.length && chars > MAX_HISTORY_CHARS) {
        chars -= recent.shift().content.length;
      }
      return recent;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question || pending) return;

      addMessage("user", question);
      history.push({ role: "user", content: question });
      input.value = "";
      resizeInput();
      setSending(true);
      showTyping();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: question, history: payloadHistory() })
        });
        const data = await response.json();
        hideTyping();
        if (!response.ok) {
          const detail = typeof data.detail === "string" ? data.detail : "The request could not be completed.";
          addMessage("assistant", detail);
          return;
        }
        addMessage("assistant", data.answer, data.sources || []);
        history.push({ role: "assistant", content: data.answer });
      } catch (error) {
        hideTyping();
        addMessage("assistant", "Network error. Please try again.");
      } finally {
        setSending(false);
        resizeInput();
        input.focus();
      }
    });

    input.addEventListener("input", () => {
      resizeInput();
      syncSend();
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll(".example").forEach((button) => {
      button.addEventListener("click", () => {
        input.value = button.dataset.prompt;
        resizeInput();
        syncSend();
        input.focus();
      });
    });

    newChat.addEventListener("click", () => {
      if (pending) return;
      thread.querySelectorAll(".message").forEach((node) => node.remove());
      history = [];
      empty.hidden = false;
      input.value = "";
      resizeInput();
      syncSend();
      input.focus();
    });

    resizeInput();
    syncSend();
  </script>
</body>
</html>
