[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navai-rag-assistant"
version = "0.1.0"
description = "FastAPI RAG assistant for the NavAI website documentation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.143.0",
    "google-genai==2.29.0",
    "groq==1.7.0",
    "httpx==0.28.1",
    "onnxruntime==1.31.0",
    "openai==3.3.1",
    "psutil==7.2.2",
    "pydantic==2.14.1",
    "python-docx==1.2.0",
    "python-dotenv==1.2.3",
    "huggingface-hub==0.36.2",
    "streamlit==1.66.1",
    "tokenizers==0.22.2",
    "transformers==4.57.6",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
navai-chat = "navai.chat:main"

[tool.setuptools]
packages = ["navai"]
