<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NavAI Assistant</title>
  <style>
    :root {
      --cream: #f4efe6;
      --cream-strong: #efe7d8;
      --ink: #171411;
      --panel: #171411;
      --panel-soft: #24201b;
      --muted: #b8aa94;
      --line: rgba(244, 239, 230, 0.12);
      --accent: #c88a3d;
      --accent-soft: rgba(200, 138, 61, 0.18);
      --user: #c88a3d;
      --assistant: #24201b;
      --shadow: 0 30px 90px rgba(23, 20, 17, 0.28);
      --radius: 26px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(200, 138, 61, 0.18), transparent 28%),
        radial-gradient(circle at 88% 92%, rgba(23, 20, 17, 0.12), transparent 30%),
        var(--cream);
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .app {
      width: min(1080px, 100%);
      height: min(880px, 94vh);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--panel);
      color: var(--cream);
      border: 1px solid rgba(244, 239, 230, 0.1);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(200, 138, 61, 0.08), transparent 42%),
        radial-gradient(circle at 80% 10%, rgba(244, 239, 230, 0.05), transparent 24%);
    }

    header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 26px 32px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(200, 138, 61, 0.12), rgba(23, 20, 17, 0.4));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 20px;
      color: var(--cream);
      background: linear-gradient(135deg, var(--accent), #8f5f24);
      box-shadow: 0 14px 34px rgba(200, 138, 61, 0.3);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      background: rgba(244, 239, 230, 0.05);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ccc65;
      box-shadow: 0 0 0 4px rgba(156, 204, 101, 0.16);
    }

    button {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 16px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--cream);
      background: rgba(244, 239, 230, 0.07);
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: rgba(244, 239, 230, 0.12);
      border-color: rgba(200, 138, 61, 0.45);
    }

    button.primary {
      color: var(--cream);
      background: linear-gradient(135deg, var(--accent), #8f5f24);
      border-color: transparent;
      box-shadow: 0 12px 28px rgba(200, 138, 61, 0.25);
    }

    .messages {
      position: relative;
      z-index: 1;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 14px;
      max-width: 84%;
      animation: rise 200ms ease-out;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      background: rgba(244, 239, 230, 0.08);
      border: 1px solid var(--line);
    }

    .message.user .avatar {
      background: linear-gradient(135deg, var(--accent), #8f5f24);
      border-color: transparent;
    }

    .bubble {
      padding: 16px 18px;
      border-radius: 20px;
      line-height: 1.65;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      background: var(--assistant);
    }

    .message.user .bubble {
      background: linear-gradient(135deg, var(--accent), #8f5f24);
      border-color: transparent;
    }

    .sources {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.7;
    }

    .sources strong {
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 10px;
      color: var(--accent);
    }

    .composer {
      position: relative;
      z-index: 1;
      padding: 20px 28px 24px;
      border-top: 1px solid var(--line);
      background: rgba(23, 20, 17, 0.94);
    }

    #chat-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: end;
    }

    textarea {
      width: 100%;
      min-height: 58px;
      max-height: 160px;
      resize: vertical;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(244, 239, 230, 0.06);
      color: var(--cream);
      padding: 16px 18px;
      font: inherit;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: rgba(200, 138, 61, 0.75);
      box-shadow: 0 0 0 4px rgba(200, 138, 61, 0.16);
    }

    .send {
      min-width: 112px;
      height: 58px;
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12.5px;
    }

    .typing {
      display: inline-flex;
      gap: 6px;
      padding: 6px 0;
    }

    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(244, 239, 230, 0.18);
      border-radius: 999px;
    }

    @media (max-width: 760px) {
      body { padding: 0; }
      .app { width: 100%; height: 100vh; border-radius: 0; }
      header { padding: 20px; }
      .messages { padding: 20px; }
      .composer { padding: 16px 20px 20px; }
      #chat-form { grid-template-columns: 1fr; }
      .send { width: 100%; }
      .message { max-width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">N</div>
        <div>
          <h1>NavAI Assistant</h1>
          <p>Retrieval-grounded answers from the NavAI documentation.</p>
        </div>
      </div>
      <div class="actions">
        <div class="status"><span class="status-dot"></span>Online</div>
        <button id="new-chat" type="button">New chat</button>
      </div>
    </header>

    <section class="messages" id="messages" aria-live="polite">
      <div class="message assistant">
        <div class="avatar">AI</div>
        <div class="bubble">
          Ask a question about NavAI products, integrations, industries, security, or company details.
        </div>
      </div>
    </section>

    <footer class="composer">
      <form id="chat-form">
        <textarea id="message" name="message" placeholder="Ask about NavAI..." required></textarea>
        <button class="primary send" type="submit">Send</button>
      </form>
      <div class="hint">Answers are generated from retrieved NavAI documentation and include citations when available.</div>
    </footer>
  </main>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const newChat = document.getElementById("new-chat");
    let history = [];

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function addMessage(role, text, sources = []) {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}`;
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "You" : "AI";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      if (sources.length) {
        const sourceBlock = document.createElement("div");
        sourceBlock.className = "sources";
        sourceBlock.innerHTML = "<strong>Sources</strong>" + sources
          .map((source) => {
            const distance = source.distance === null ? "n/a" : Number(source.distance).toFixed(4);
            return `<div>[${source.label}] ${escapeHtml(source.doc)} | chunk ${source.chunk_index} | rerank ${Number(source.rerank).toFixed(4)} | distance ${distance}</div>`;
          })
          .join("");
        bubble.appendChild(sourceBlock);
      }
      wrapper.append(avatar, bubble);
      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
      const wrapper = document.createElement("div");
      wrapper.className = "message assistant";
      wrapper.id = "typing";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "AI";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      wrapper.append(avatar, bubble);
      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping() {
      document.getElementById("typing")?.remove();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage("user", question);
      history.push({ role: "user", content: question });
      input.value = "";
      showTyping();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: question, history: history.slice(0, -1) })
        });
        const data = await response.json();
        hideTyping();
        if (!response.ok) {
          addMessage("assistant", data.detail || "The request could not be completed.");
          return;
        }
        addMessage("assistant", data.answer, data.sources || []);
        history.push({ role: "assistant", content: data.answer });
      } catch (error) {
        hideTyping();
        addMessage("assistant", "Network error. Please try again.");
      }
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    newChat.addEventListener("click", () => {
      messages.innerHTML = "";
      history = [];
      addMessage("assistant", "New chat started. Ask a question about NavAI.");
    });
  </script>
</body>
</html>
