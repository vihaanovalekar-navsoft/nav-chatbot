<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NavAI Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #697386;
      --line: #e3e8f1;
      --brand: #4f46e5;
      --brand-dark: #4338ca;
      --user-bubble: #4f46e5;
      --shadow: 0 12px 34px rgba(23, 32, 51, 0.08);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, #e9e7ff 0, transparent 34%),
        radial-gradient(circle at 90% 100%, #e3f1ff 0, transparent 30%),
        var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: min(920px, 100%);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.55);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--brand), #7c3aed);
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.32);
    }

    h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }

    .header p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      gap: 12px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.14);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      animation: rise 180ms ease-out;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #eef2ff;
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      user-select: none;
    }

    .message.user .avatar {
      background: var(--brand);
      color: #fff;
    }

    .bubble {
      max-width: min(680px, 82%);
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.58;
      font-size: 14.5px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: var(--shadow);
    }

    .message.assistant .bubble {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top-left-radius: 4px;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
      border-top-right-radius: 4px;
      box-shadow: 0 10px 24px rgba(79, 70, 229, 0.22);
    }

    .sources {
      margin-top: 11px;
      padding-top: 9px;
      border-top: 1px dashed var(--line);
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sources-title {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8a94a6;
    }

    .dots {
      display: inline-flex;
      gap: 4px;
      padding: 3px 0;
    }

    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9aa4b5;
      animation: blink 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    .composer {
      padding: 12px 24px 4px;
      background: rgba(255, 255, 255, 0.92);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .composer form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    textarea {
      flex: 1;
      min-height: 46px;
      max-height: 140px;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-size: 14.5px;
      line-height: 1.45;
      color: var(--ink);
      background: #fff;
      outline: none;
      transition: border-color 140ms, box-shadow 140ms;
    }

    textarea:focus {
      border-color: #b9b5ff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    textarea::placeholder { color: #98a1b2; }

    button {
      height: 46px;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: background 140ms, transform 140ms, opacity 140ms;
    }

    button:hover:not(:disabled) { background: var(--brand-dark); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    button.new-chat {
      height: 34px;
      padding: 0 12px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: none;
      transition: background 140ms, border-color 140ms, opacity 140ms;
    }

    button.new-chat:hover:not(:disabled) {
      background: #f7f8fc;
      border-color: #d5dbe6;
    }

    .hint {
      margin: 7px 0 8px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .header { padding: 14px 16px; }
      .messages { padding: 18px 14px 8px; }
      .composer { padding: 10px 14px 2px; }
      .bubble { max-width: 86%; font-size: 14px; }
      .status { display: none; }
      .logo { width: 36px; height: 36px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">N</div>
        <div>
          <h1>NavAI Assistant</h1>
          <p>Ask about NavAI products, solutions, and industries.</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="status"><span class="status-dot" aria-hidden="true"></span>Online</div>
        <button id="new-chat" class="new-chat" type="button">New chat</button>
      </div>
    </header>

    <section id="messages" class="messages" role="log" aria-live="polite"></section>

    <div class="composer">
      <form id="chat-form">
        <textarea
          id="message"
          rows="1"
          maxlength="2000"
          placeholder="Ask about NavAI..."
          aria-label="Ask a question about NavAI"
          required
        ></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <p class="hint">Enter to send &middot; Shift+Enter for a new line</p>
    </div>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const newChat = document.getElementById("new-chat");
    const messages = document.getElementById("messages");
    const STORAGE_KEY = "navai-chat-turns-v1";
    const MAX_TURNS = 6;
    const MAX_HISTORY_CHARS = 12000;
    let turns = loadTurns();
    let busy = false;

    function addMessage(role, text) {
      const row = document.createElement("div");
      row.className = "message " + role;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.setAttribute("aria-hidden", "true");
      avatar.textContent = role === "user" ? "Y" : "N";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.append(avatar, bubble);
      messages.append(row);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    function addGreeting() {
      addMessage("assistant", "Hi! Ask me anything about NavAI.");
    }

    function addSources(bubble, sources) {
      if (!sources || !sources.length) return;

      const block = document.createElement("div");
      block.className = "sources";

      const title = document.createElement("div");
      title.className = "sources-title";
      title.textContent = "Sources";
      block.append(title);

      for (const source of sources) {
        const item = document.createElement("div");
        const score = Number(source.rerank).toFixed(2);
        item.textContent =
          "[" + source.label + "] " + source.doc +
          " - chunk " + source.chunk_index + " - rerank " + score;
        block.append(item);
      }

      bubble.append(block);
    }

    function addLoading() {
      const row = document.createElement("div");
      row.className = "message assistant";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.setAttribute("aria-hidden", "true");
      avatar.textContent = "N";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const dots = document.createElement("span");
      dots.className = "dots";
      for (let i = 0; i < 3; i++) {
        dots.append(document.createElement("span"));
      }

      bubble.append(dots);
      row.append(avatar, bubble);
      messages.append(row);
      messages.scrollTop = messages.scrollHeight;
      return row;
    }

    function loadTurns() {
      let raw;
      try {
        raw = sessionStorage.getItem(STORAGE_KEY);
      } catch {
        // Storage can be unavailable in private windows.
        return [];
      }
      if (!raw) return [];

      try {
        const stored = JSON.parse(raw);
        if (!Array.isArray(stored)) return [];
        return stored.filter(
          (turn) =>
            turn &&
            typeof turn.question === "string" &&
            typeof turn.answer === "string" &&
            Array.isArray(turn.sources)
        );
      } catch {
        return [];
      }
    }

    function saveTurns() {
      try {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(turns));
      } catch {
        // The in-memory session still works.
      }
    }

    function historyChars() {
      return turns.reduce(
        (total, turn) => total + turn.question.length + turn.answer.length,
        0
      );
    }

    function trimTurns() {
      while (turns.length > MAX_TURNS || historyChars() > MAX_HISTORY_CHARS) {
        turns.shift();
      }
    }

    function restoreTurns() {
      for (const turn of turns) {
        addMessage("user", turn.question);
        const bubble = addMessage("assistant", turn.answer);
        addSources(bubble, turn.sources);
      }
    }

    function setBusy(value) {
      busy = value;
      send.disabled = value;
      newChat.disabled = value;
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    }

    input.addEventListener("input", resizeInput);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    newChat.addEventListener("click", () => {
      if (busy) return;

      turns = [];
      try {
        sessionStorage.removeItem(STORAGE_KEY);
      } catch {
        // The in-memory session still resets.
      }
      messages.replaceChildren();
      addGreeting();
      input.value = "";
      resizeInput();
      input.focus();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      const question = input.value.trim();
      if (!question) return;

      const priorHistory = turns.flatMap((turn) => [
        { role: "user", content: turn.question },
        { role: "assistant", content: turn.answer },
      ]);

      addMessage("user", question);
      input.value = "";
      resizeInput();
      setBusy(true);
      const loading = addLoading();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: question,
            history: priorHistory,
          }),
        });

        if (!response.ok) {
          throw new Error("Request failed with status " + response.status);
        }

        const data = await response.json();
        loading.remove();
        const bubble = addMessage("assistant", data.answer);
        addSources(bubble, data.sources);

        turns.push({
          question,
          answer: data.answer,
          sources: data.sources || [],
        });
        trimTurns();
        saveTurns();
      } catch {
        loading.remove();
        addMessage("assistant", "Something went wrong. Please try again.");
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    addGreeting();
    restoreTurns();
    input.focus();
  </script>
</body>
</html>
